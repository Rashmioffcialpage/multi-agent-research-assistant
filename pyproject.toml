[project]
name = "research-assistant"
version = "0.1.0"
description = "Multi-agent research assistant built with LangGraph: planner/researcher/critic/writer agents, BM25 retrieval over a local corpus, local LLM via Ollama, FastAPI serving."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<2",
    "langchain-core>=1.5,<2",
    "langchain-ollama>=1.1,<2",
    "rank-bm25>=0.2.2,<0.3",
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.35,<0.36",
    "pydantic>=2.9,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "ruff>=0.7,<0.8",
]
websearch = [
    "ddgs>=9.0,<10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["research_assistant*"]
